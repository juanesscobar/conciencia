# ============================================================
# MISSION CONTROL — COMPOSE PARA HETZNER + TAILSCALE
# ------------------------------------------------------------
# Acceso SOLO desde tu tailnet (100.x.x.x)
# Sin puertos públicos expuestos al internet
#
# Setup:
#   1. Instalar Tailscale en el VPS: curl -fsSL https://tailscale.com/install.sh | sh
#   2. Conectar: tailscale up
#   3. Copiar .env.example → .env y completar
#   4. docker compose -f docker-compose.tailscale.yml up -d --build
#
# Acceso: http://mission-control (si MagicDNS está activo)
#     o:  http://100.x.y.z (IP de Tailscale del VPS)
# ============================================================
version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"  # Solo localhost (Tailscale serve puede proxy aquí)
    volumes:
      - ./nginx/nginx-tailscale.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: missioncontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: missioncontrol
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missioncontrol"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://missioncontrol:${POSTGRES_PASSWORD}@db:5432/missioncontrol
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:?Definí SECRET_KEY en .env}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USERNAME=juanesscobar
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://mission-control}
    volumes:
      - ./agents:/app/agents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
