# ============================================================
# MISSION CONTROL — NGINX (producción)
# - HTTP: la IP sirve la app (default_server) — estable para dev
# - HTTPS por IP: certificado local (CA "Mission Control Dev")
#   → instalar ca.crt una vez en cada equipo para candado verde
# - HTTPS por dominio (mc.46.62.196.151.sslip.io): Let's Encrypt
# ============================================================
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    upstream backend {
        server backend:8000;
    }
    upstream frontend {
        server frontend:80;
    }

    # ================= HTTP =================
    # IP directa (default) → sirve la app (estable, sin redirects)
    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Descarga del certificado CA local para instalar en los equipos
        location = /ca.crt {
            alias /etc/nginx/certs/ca.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="mission-control-ca.crt"';
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /docs { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /openapi.json { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /redoc { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /health { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Dominio sslip.io → redirige a HTTPS (para equipos con DNS OK)
    server {
        listen 80;
        server_name mc.46.62.196.151.sslip.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://mc.46.62.196.151.sslip.io$request_uri;
        }
    }

    # ================= HTTPS =================
    # HTTPS por IP (default) — certificado local "Mission Control Dev CA"
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/certs/ip-server.crt;
        ssl_certificate_key /etc/nginx/certs/ip-server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /ca.crt {
            alias /etc/nginx/certs/ca.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="mission-control-ca.crt"';
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /docs { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /openapi.json { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /redoc { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /health { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # HTTPS por dominio — Let's Encrypt (público, sin instalar nada)
    server {
        listen 443 ssl;
        server_name mc.46.62.196.151.sslip.io;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /docs { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /openapi.json { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /redoc { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /health { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; }

        # WebMCP Demo App (hackathon/desmo) — servida bajo /webmcp-demo/ con el mismo HTTPS
        location /webmcp-demo/ {
            proxy_pass http://webmcp-demo:8765/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # la app usa rutas absolutas /api/webmcp/* → se reescriben bajo el subpath
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter '"/api/webmcp/' '"/webmcp-demo/api/webmcp/';
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
