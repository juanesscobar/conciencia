<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1040" height="760" fill="#0a0f1a"/>
  <text x="24" y="36" fill="#00ff41" font-size="20" font-weight="bold">CONCIENCIA — Open Control Plane for Autonomous Work</text>
  <text x="24" y="58" fill="#5b6475" font-size="12">AI models + agents + tools → real-world autonomous work</text>

  <!-- ZONE: EXTERNAL -->
  <rect x="20" y="90" width="200" height="630" rx="8" fill="#111827" stroke="#374151" stroke-dasharray="6 5"/>
  <text x="36" y="116" fill="#e5e7eb" font-size="13" font-weight="bold">EXTERNAL</text>
  <g>
    <rect x="36" y="130" width="168" height="44" rx="6" fill="#1d4ed8" stroke="#3b82f6"/>
    <text x="120" y="150" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Operators</text>
    <text x="120" y="166" fill="#bfdbfe" font-size="10" text-anchor="middle">Operator / Client UI</text>
  </g>
  <g>
    <rect x="36" y="186" width="168" height="44" rx="6" fill="#1d4ed8" stroke="#3b82f6"/>
    <text x="120" y="206" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">GitHub</text>
    <text x="120" y="222" fill="#bfdbfe" font-size="10" text-anchor="middle">repos · PRs · issues</text>
  </g>
  <g>
    <rect x="36" y="242" width="168" height="44" rx="6" fill="#1d4ed8" stroke="#3b82f6"/>
    <text x="120" y="262" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Email</text>
    <text x="120" y="278" fill="#bfdbfe" font-size="10" text-anchor="middle">IMAP read · SMTP send</text>
  </g>
  <g>
    <rect x="36" y="298" width="168" height="44" rx="6" fill="#1d4ed8" stroke="#3b82f6"/>
    <text x="120" y="318" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">WhatsApp</text>
    <text x="120" y="334" fill="#bfdbfe" font-size="10" text-anchor="middle">QR-linked session</text>
  </g>
  <g>
    <rect x="36" y="354" width="168" height="44" rx="6" fill="#1d4ed8" stroke="#3b82f6"/>
    <text x="120" y="374" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Overpass / OSM</text>
    <text x="120" y="390" fill="#bfdbfe" font-size="10" text-anchor="middle">lead discovery</text>
  </g>
  <g>
    <rect x="36" y="410" width="168" height="92" rx="6" fill="#92400e" stroke="#f59e0b"/>
    <text x="120" y="430" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">LLM Providers</text>
    <text x="120" y="446" fill="#fde68a" font-size="10" text-anchor="middle">DeepSeek · OpenAI</text>
    <text x="120" y="460" fill="#fde68a" font-size="10" text-anchor="middle">Anthropic · Google</text>
    <text x="120" y="474" fill="#fde68a" font-size="10" text-anchor="middle">OpenRouter · Ollama</text>
    <text x="120" y="492" fill="#fde68a" font-size="10" text-anchor="middle">(auto-fallback)</text>
  </g>
  <g>
    <rect x="36" y="514" width="168" height="44" rx="6" fill="#991b1b" stroke="#ef4444"/>
    <text x="120" y="534" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">MCP Servers</text>
    <text x="120" y="550" fill="#fecaca" font-size="10" text-anchor="middle">any stdio tool server</text>
  </g>
  <g>
    <rect x="36" y="570" width="168" height="92" rx="6" fill="#111827" stroke="#374151"/>
    <text x="120" y="590" fill="#e5e7eb" font-size="12" text-anchor="middle" font-weight="bold">Storage</text>
    <text x="120" y="608" fill="#99f6e4" font-size="10" text-anchor="middle">PostgreSQL (data)</text>
    <text x="120" y="624" fill="#99f6e4" font-size="10" text-anchor="middle">Redis (cache/queue)</text>
    <text x="120" y="640" fill="#99f6e4" font-size="10" text-anchor="middle">agents/ (SOUL.md)</text>
    <text x="120" y="656" fill="#99f6e4" font-size="10" text-anchor="middle">proposals/ (PDF)</text>
  </g>

  <!-- ZONE: CONCIENCIA -->
  <rect x="250" y="90" width="760" height="630" rx="8" fill="#0f172a" stroke="#00ff41" stroke-width="1.5"/>
  <text x="266" y="116" fill="#00ff41" font-size="13" font-weight="bold">CONCIENCIA (FastAPI + React)</text>

  <!-- BUILD -->
  <rect x="270" y="132" width="236" height="270" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="286" y="154" fill="#00ff41" font-size="12" font-weight="bold">BUILD</text>
  <g>
    <rect x="286" y="166" width="204" height="56" rx="6" fill="#4338ca" stroke="#6366f1"/>
    <text x="388" y="186" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">8 Agents</text>
    <text x="388" y="202" fill="#c7d2fe" font-size="10" text-anchor="middle">dev · ops · qa · pm · rd · comms · fin · admin</text>
    <text x="388" y="216" fill="#c7d2fe" font-size="10" text-anchor="middle">SOUL.md = system prompt</text>
  </g>
  <g>
    <rect x="286" y="232" width="204" height="56" rx="6" fill="#4338ca" stroke="#6366f1"/>
    <text x="388" y="252" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Tool Registry</text>
    <text x="388" y="268" fill="#c7d2fe" font-size="10" text-anchor="middle">MCP attach · email_send</text>
    <text x="388" y="282" fill="#c7d2fe" font-size="10" text-anchor="middle">email_inbox · email_test</text>
  </g>
  <g>
    <rect x="286" y="298" width="204" height="56" rx="6" fill="#4338ca" stroke="#6366f1"/>
    <text x="388" y="318" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">LLM Harness</text>
    <text x="388" y="334" fill="#c7d2fe" font-size="10" text-anchor="middle">routing · fallback · cost</text>
    <text x="388" y="348" fill="#c7d2fe" font-size="10" text-anchor="middle">latency · simulated mode</text>
  </g>
  <g>
    <rect x="286" y="364" width="204" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="388" y="382" fill="#a3adbd" font-size="10" text-anchor="middle">models · skills · registry</text>
  </g>

  <!-- OPERATE -->
  <rect x="522" y="132" width="236" height="270" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="538" y="154" fill="#00ff41" font-size="12" font-weight="bold">OPERATE</text>
  <g>
    <rect x="538" y="166" width="204" height="56" rx="6" fill="#0f766e" stroke="#14b8a6"/>
    <text x="640" y="186" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Missions</text>
    <text x="640" y="202" fill="#99f6e4" font-size="10" text-anchor="middle">units of autonomous work</text>
    <text x="640" y="216" fill="#99f6e4" font-size="10" text-anchor="middle">state · retries · results</text>
  </g>
  <g>
    <rect x="538" y="232" width="204" height="56" rx="6" fill="#0f766e" stroke="#14b8a6"/>
    <text x="640" y="252" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Workflows</text>
    <text x="640" y="268" fill="#99f6e4" font-size="10" text-anchor="middle">approval gates (HITL)</text>
    <text x="640" y="282" fill="#99f6e4" font-size="10" text-anchor="middle">task DAG · READY/BLOCKED</text>
  </g>
  <g>
    <rect x="538" y="298" width="204" height="56" rx="6" fill="#0f766e" stroke="#14b8a6"/>
    <text x="640" y="318" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Lead Hunter</text>
    <text x="640" y="334" fill="#99f6e4" font-size="10" text-anchor="middle">discover → enrich → score</text>
    <text x="640" y="348" fill="#99f6e4" font-size="10" text-anchor="middle">→ propose → deliver</text>
  </g>
  <g>
    <rect x="538" y="364" width="204" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="640" y="382" fill="#a3adbd" font-size="10" text-anchor="middle">runtime · execution · results</text>
  </g>

  <!-- CONTROL -->
  <rect x="774" y="132" width="220" height="270" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="790" y="154" fill="#00ff41" font-size="12" font-weight="bold">CONTROL</text>
  <g>
    <rect x="790" y="166" width="188" height="44" rx="6" fill="#92400e" stroke="#f59e0b"/>
    <text x="884" y="186" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Governance</text>
    <text x="884" y="202" fill="#fde68a" font-size="10" text-anchor="middle">policies · decisions</text>
  </g>
  <g>
    <rect x="790" y="220" width="188" height="44" rx="6" fill="#92400e" stroke="#f59e0b"/>
    <text x="884" y="240" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Approvals</text>
    <text x="884" y="256" fill="#fde68a" font-size="10" text-anchor="middle">human-in-the-loop</text>
  </g>
  <g>
    <rect x="790" y="274" width="188" height="44" rx="6" fill="#92400e" stroke="#f59e0b"/>
    <text x="884" y="294" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Audit + Traces</text>
    <text x="884" y="310" fill="#fde68a" font-size="10" text-anchor="middle">every action logged</text>
  </g>
  <g>
    <rect x="790" y="328" width="188" height="44" rx="6" fill="#92400e" stroke="#f59e0b"/>
    <text x="884" y="348" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Costs</text>
    <text x="884" y="364" fill="#fde68a" font-size="10" text-anchor="middle">per mission / agent</text>
  </g>

  <!-- ENTRY -->
  <rect x="270" y="420" width="724" height="54" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="286" y="440" fill="#e5e7eb" font-size="12" font-weight="bold">API Gateway — nginx → FastAPI</text>
  <text x="286" y="458" fill="#a3adbd" font-size="10">REST + Swagger docs · auth (JWT) · CORS · /api/v1/*</text>

  <!-- COMMAND CENTER -->
  <rect x="270" y="486" width="724" height="54" rx="6" fill="#1e293b" stroke="#00ff41" stroke-dasharray="4 3"/>
  <text x="286" y="506" fill="#00ff41" font-size="12" font-weight="bold">Command Center — React UI (Operator / Client modes)</text>
  <text x="286" y="524" fill="#a3adbd" font-size="10">dashboard · missions · workflows · agents · email · lead pipeline · governance · costs · traces · audit</text>

  <!-- MISSION FLOW -->
  <rect x="270" y="552" width="724" height="56" rx="6" fill="#111827" stroke="#374151"/>
  <text x="286" y="572" fill="#e5e7eb" font-size="12" font-weight="bold">Example Mission: qualify a lead</text>
  <text x="286" y="592" fill="#a3adbd" font-size="10">Lead in → Research → Enrich → Score → Human approval → Outreach (email/WhatsApp) → CRM update → Audit</text>

