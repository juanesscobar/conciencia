  <line x1="204" y1="376" x2="250" y2="376" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="204" y1="456" x2="250" y2="456" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="456" x2="522" y2="456" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="758" y1="456" x2="774" y2="456" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="632" y1="516" x2="632" y2="552" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="204" y1="616" x2="270" y2="616" stroke="#00ff41" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="632" y1="608" x2="632" y2="630" stroke="#00ff41" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="884" y1="600" x2="884" y2="630" stroke="#00ff41" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- LEGEND -->
  <text x="270" y="660" fill="#5b6475" font-size="11">— external input  ····· storage reads/writes</text>
