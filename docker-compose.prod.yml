version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: missioncontrol
      POSTGRES_USER: mcuser
      POSTGRES_PASSWORD: changeme123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mc_network
  redis:
    image: redis:7-alpine
    networks:
      - mc_network
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://mcuser:changeme123@db:5432/missioncontrol
      REDIS_URL: redis://redis:6379
      SECRET_KEY: secretkey123
      CORS_ORIGINS: "*"
    depends_on:
      - db
      - redis
    networks:
      - mc_network
  frontend:
    build: ./frontend
    depends_on:
      - backend
    networks:
      - mc_network
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mc_network
volumes:
  postgres_data:
networks:
  mc_network:
    driver: bridge
