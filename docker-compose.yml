# ============================================================
# MISSION CONTROL — COMPOSE DE PRODUCCIÓN (seguro)
# ------------------------------------------------------------
# - SOLO nginx expone puertos (80 / 443).
# - Postgres y Redis NO publican puertos: solo red interna.
# - Credenciales fuertes vía .env (ver .env.example en la raíz).
# - Backend corre con gunicorn (sin --reload), ENVIRONMENT=production.
# - Frontend se construye (npm run build) y se sirve estático.
#
# Uso:  cp .env.example .env  → completar valores →  docker compose up -d --build
# Dev local con HMR:          docker compose -f docker-compose.dev.yml up
# ============================================================
version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # - "443:443"   # Activar cuando exista dominio + certificados (HTTPS)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # fullchain.pem + privkey.pem
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: missioncontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: missioncontrol
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missioncontrol"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # SIN ports → no accesible desde internet

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # SIN ports → no accesible desde internet

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://missioncontrol:${POSTGRES_PASSWORD}@db:5432/missioncontrol
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:?Definí SECRET_KEY en .env}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USERNAME=juanesscobar
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://46.62.196.151}
    volumes:
      - ./agents:/app/agents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # SIN ports → solo accesible vía nginx

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://46.62.196.151}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
