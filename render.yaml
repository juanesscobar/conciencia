services:
  - type: web
    name: mission-control-api
    runtime: docker
    repo: https://github.com/juanesscobar/mission-control
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mission-control-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://mission-control.onrender.com
      - key: GITHUB_USERNAME
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  - type: web
    name: mission-control
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://mission-control-api.onrender.com

databases:
  - name: mission-control-db
    databaseName: missioncontrol
    plan: free

redis:
  - name: mission-control-redis
    plan: free
