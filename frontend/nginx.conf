# Nginx interno del frontend estático (dentro de la imagen)
# Fallback SPA: cualquier ruta no-archivo sirve index.html (react-router)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
